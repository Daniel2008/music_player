name: music_player
description: "跨平台桌面音乐播放器 - 支持本地/在线音乐播放、歌词同步、音频可视化"
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_soloud: ^4.0.7
  file_picker: ^11.0.2
  shared_preferences: ^2.3.2
  http: ^1.2.2
  hotkey_manager: ^0.2.3
  window_manager: ^0.5.1
  path_provider: ^2.1.4
  uuid: ^4.5.1
  cached_network_image: ^3.2.3
  flutter_cache_manager: ^3.3.1
  path: ^1.9.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.0
  smtc_windows: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/skins/
    - assets/lyrics/
